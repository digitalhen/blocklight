server {
    listen 8080;
    root /usr/share/nginx/html;
    port_in_redirect off;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/geo+json application/octet-stream image/svg+xml;

    location = /healthz { access_log off; return 200 'ok\n'; }
    location = /blocklight { return 308 /blocklight/$is_args$args; }
    location /blocklight/assets/ {
        add_header Cache-Control 'public, max-age=31536000, immutable';
        try_files $uri =404;
    }
    location /blocklight/data/ {
        add_header Cache-Control 'public, max-age=3600';
        types { application/json json geojson; application/vnd.mapbox-vector-tile pbf; }
        try_files $uri =404;
    }
    location /blocklight/ {
        add_header Cache-Control 'no-cache';
        try_files $uri $uri/ =404;
    }
    location / { return 404; }
}
